services:
  healthapp:
    image: ${HEALTHAPP_IMAGE:-ghcr.io/marianoeramirez/healthapp:latest}
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      # Bind mount so host nginx can serve /static and /media
      - ./data:/data
    ports:
      - "8001:8000"
    restart: unless-stopped
