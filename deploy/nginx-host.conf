# Install on the GCE VM (host nginx), same pattern as memoriadelalma:
#   sudo cp deploy/nginx-host.conf /etc/nginx/sites-available/healthapp.conf
#   sudo ln -sf /etc/nginx/sites-available/healthapp.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d health.marianoeramirez.com
#
# Adjust the alias paths if DEPLOY_PATH is not /home/marianoramirez353/healthapp

server {
    listen 80;
    listen [::]:80;
    server_name health.marianoeramirez.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name health.marianoeramirez.com;
    server_tokens off;

    # Filled/managed by Certbot on first run, or set manually after certbot --nginx
    # ssl_certificate /etc/letsencrypt/live/health.marianoeramirez.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/health.marianoeramirez.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    location /static/ {
        alias /home/marianoramirez353/healthapp/data/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /home/marianoramirez353/healthapp/data/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
