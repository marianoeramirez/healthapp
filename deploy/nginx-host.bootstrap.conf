# HTTP-only bootstrap site for the first Certbot run.
# After certificates exist, replace with nginx-host.conf (or let certbot --nginx rewrite).

server {
    listen 80;
    listen [::]:80;
    server_name health.marianoeramirez.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /home/marianoramirez353/healthapp/data/staticfiles/;
        access_log off;
    }

    location /media/ {
        alias /home/marianoramirez353/healthapp/data/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
